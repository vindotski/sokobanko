# Sokobanko's levels: one Markdown file per level, named by its slug, imported into the
# `sokobanko` project on api.vin.ski (Spotcraft's roadmap, stage 2, step 13). Rules JSON Schema
# can't express (exactly one player, as many goals as boxes) are parseLevel's, in packages/core.
type: object
required: [title, map]
properties:
  title:
    type: string
    minLength: 1
    maxLength: 80
  map:
    description: Rows of XSB glyphs, top to bottom. Shorter rows are padded with floor.
    type: array
    minItems: 1
    maxItems: 50
    items:
      type: string
      pattern: "^[ #.$@*+]{1,50}$"
  order:
    description: Play order. Levels without one come last, by slug.
    type: integer
