# Each player's best results: one file per Spotcraft account, `progress/<id>.md`, written by
# Sokobanko's server after it has checked the session and replayed the solution
# (apps/web/server/utils/progress.ts). Only the best moves and pushes per level are kept, not
# solutions, since published content is public.
type: object
required: [completions]
properties:
  completions:
    type: array
    items:
      type: object
      required: [level, moves, pushes, completedAt]
      additionalProperties: false
      properties:
        level:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,99}$"
        moves:
          type: integer
          minimum: 1
        pushes:
          type: integer
          minimum: 1
        completedAt:
          type: string
          format: date-time
