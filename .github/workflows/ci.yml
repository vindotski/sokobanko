name: CI

# Pull requests: check the branch's name, verify, and build the image (not
# pushed) so a broken Dockerfile shows before merging. main: verify, then
# publish the image to Docker Hub. v* tags: the same, then copy the image to
# the instance's registry (Spotdeck) and deploy that version to Spotcraft
# through the app's deploy hook (docs/Deploying-on-Spotcraft.md,
# docs/Contributing.md). Pull requests and main also test every Storybook
# story (storybook). Every run also runs the image without Spotcraft, from
# self-host/ (self-host).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Work happens on short-lived branches cut from main and merged back into it:
  # feature/, bugfix/ or chore/, then lowercase letters, digits, dots and
  # hyphens (docs/Contributing.md).
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the branch and its target
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" != main ]; then
            echo "::error::Open the pull request against main, not $BASE."
            exit 1
          fi
          if ! echo "$HEAD" | grep -Eq '^(feature|bugfix|chore)/[a-z0-9][a-z0-9.-]*$'; then
            echo "::error::Name the branch feature/<name>, bugfix/<name> or chore/<name> (lowercase letters, digits, dots and hyphens), not $HEAD."
            exit 1
          fi

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The database tests run against Spotkit's local stack, set up as on a
      # Spotcraft server: Postgres with the app's schema, and the user pool. It
      # also applies the migrations and writes .env. `spotkit dev` then keeps
      # serving its analytics and legal stand-ins, so it runs in the background
      # and the step waits for it to say so.
      - name: Start Spotkit's local stack
        run: |
          nohup pnpm exec spotkit dev > spotkit-dev.log 2>&1 &
          for _ in $(seq 90); do
            if grep -q '^Serving the' spotkit-dev.log; then cat spotkit-dev.log; exit 0; fi
            sleep 2
          done
          cat spotkit-dev.log
          exit 1
      - name: Test
        run: |
          set -a
          . ./.env
          set +a
          pnpm test:unit
      - run: pnpm build

  # Every story in stories/ as a test, in light and dark: it renders, passes
  # its play function and axe, and matches its screenshot in __screenshots__/
  # (rendered here, on Linux; update-screenshots.yml makes new ones). Then the
  # static Storybook builds, so the docs can't break unnoticed.
  storybook:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      # The new, actual and diff images of failed comparisons; a missing
      # reference is written there too, so a first run yields the baselines.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: |
            stories/**/__screenshots__/
            .vitest/attachments/
          if-no-files-found: ignore
      - run: pnpm build-storybook

  # Sokoban without Spotcraft (docs/Self-Hosting.md): the self-host/ stack
  # (Postgres, the user pool, the app and Caddy) from a fresh image, migrated,
  # and the smoke test against it: legal pages, a guest's solve in both
  # exports, and deleting the guest deletes the result.
  self-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COMPOSE_FILE: self-host/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: sokoban:self-host
          provenance: false
          cache-from: type=gha
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Migrate
        run: docker compose run --rm --no-deps --entrypoint /nodejs/bin/node app .output/server/index.mjs migrate
      - name: Smoke test
        run: node scripts/smoke.ts
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Needs the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN to push.
  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build runs natively (--platform=$BUILDPLATFORM); only the small final
      # stage of the arm64 image (Spotcraft's servers are ARM) needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUSH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 → 1.2.3, 1.2 and latest; every build → sha-abc1234, the tag to
      # deploy, so a rollback is picking the previous one.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME || 'vindotski' }}/sokoban
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=sokoban
            org.opencontainers.image.description=Sokoban, a box-pushing puzzle, hosted on Spotcraft
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/vindotski/sokoban

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A v* tag → Spotcraft (docs/Deploying-on-Spotcraft.md): the image the job
  # above published is copied, as it is (same digest, both architectures), to
  # the instance's registry, Spotdeck, under the version (v1.2.3 → 1.2.3), and
  # the app's deploy hook is called with that tag. Merges to main only build.
  # The production environment accepts only v* tags and holds the variables
  # SPOTCRAFT_REGISTRY and SPOTCRAFT_HOOK_URL and the secrets
  # SPOTCRAFT_PUSH_TOKEN and SPOTCRAFT_DEPLOY_TOKEN. A job's `if` can't see an
  # environment's variables, so the step checks: without all four, nothing
  # happens.
  deploy:
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Check the settings
        id: settings
        env:
          REGISTRY: ${{ vars.SPOTCRAFT_REGISTRY }}
          URL: ${{ vars.SPOTCRAFT_HOOK_URL }}
          PUSH_TOKEN: ${{ secrets.SPOTCRAFT_PUSH_TOKEN }}
          DEPLOY_TOKEN: ${{ secrets.SPOTCRAFT_DEPLOY_TOKEN }}
        run: |
          if [ -z "$REGISTRY" ] || [ -z "$URL" ] || [ -z "$PUSH_TOKEN" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::notice::No deploy: set SPOTCRAFT_REGISTRY and SPOTCRAFT_HOOK_URL, and the secrets SPOTCRAFT_PUSH_TOKEN and SPOTCRAFT_DEPLOY_TOKEN, in the production environment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.settings.outputs.ready == 'true'
        with:
          registry: ${{ vars.SPOTCRAFT_REGISTRY }}
          username: sokoban
          password: ${{ secrets.SPOTCRAFT_PUSH_TOKEN }}
      # The push token reaches only <registry>/sokoban.
      - name: Copy the image to Spotdeck
        if: steps.settings.outputs.ready == 'true'
        env:
          REGISTRY: ${{ vars.SPOTCRAFT_REGISTRY }}
          HUB: ${{ vars.DOCKERHUB_USERNAME || 'vindotski' }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "$REGISTRY/sokoban:$VERSION" "docker.io/$HUB/sokoban:$VERSION"
          docker buildx imagetools inspect "$REGISTRY/sokoban:$VERSION"
      - name: Deploy to Spotcraft
        if: steps.settings.outputs.ready == 'true'
        env:
          URL: ${{ vars.SPOTCRAFT_HOOK_URL }}
          TOKEN: ${{ secrets.SPOTCRAFT_DEPLOY_TOKEN }}
          # A pull may take 5 minutes and the health check 2, after other apps' deploys.
          WAIT_MINUTES: 15
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          auth="Authorization: Bearer $TOKEN"
          curl -fsS --retry 5 --retry-all-errors -X POST "$URL" -H "$auth" \
            -H 'content-type: application/json' -d "{\"tag\":\"$TAG\"}"
          deadline=$((SECONDS + WAIT_MINUTES * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            sleep 5
            # A failed poll (Spotcraft restarting, a network blip) is tried again.
            result=$(curl -fsS "$URL" -H "$auth") || continue
            case $(echo "$result" | jq -r '.state + " " + .tag') in
              "live $TAG") exit 0 ;;
              live*) echo "Another tag is live: $result"; exit 1 ;;
              failed*) echo "$result"; exit 1 ;;
            esac
          done
          echo "Not live after $WAIT_MINUTES minutes"; exit 1
