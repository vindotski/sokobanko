name: CI

# Pull requests: check the branch's name, verify, and build the image (not
# pushed) so a broken Dockerfile shows before merging. main: verify, then
# publish the image to Docker Hub. v* tags: the same, then deploy the tagged
# commit to Spotcraft through its deploy hook (DEPLOY.md, CONTRIBUTING.md).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Work happens on short-lived branches cut from main and merged back into it:
  # feature/, bugfix/ or chore/, then lowercase letters, digits, dots and
  # hyphens (CONTRIBUTING.md).
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the branch and its target
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" != main ]; then
            echo "::error::Open the pull request against main, not $BASE."
            exit 1
          fi
          if ! echo "$HEAD" | grep -Eq '^(feature|bugfix|chore)/[a-z0-9][a-z0-9.-]*$'; then
            echo "::error::Name the branch feature/<name>, bugfix/<name> or chore/<name> (lowercase letters, digits, dots and hyphens), not $HEAD."
            exit 1
          fi

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The database tests run against Spotcraft's local stack, set up as on its
      # servers: Postgres with the app's schema, and the user pool. It also
      # applies the migrations and writes apps/web/.env.
      - name: Start Spotcraft's local stack
        working-directory: apps/web
        run: pnpm exec spotcraft dev
      - name: Test
        run: |
          set -a
          . apps/web/.env
          set +a
          pnpm test
      - run: pnpm build

  # Needs the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN to push.
  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build runs natively (--platform=$BUILDPLATFORM); only the small final
      # stage of the arm64 image (Spotcraft's servers are ARM) needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUSH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 → 1.2.3, 1.2 and latest; every build → sha-abc1234, the tag to
      # deploy, so a rollback is picking the previous one.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME || 'vindotski' }}/sokobanko
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=sokobanko
            org.opencontainers.image.description=Sokobanko, a box-pushing puzzle, hosted on Spotcraft
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/vindotski/sokobanko

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A v* tag → Spotcraft, through the app's deploy hook (DEPLOY.md); merges to
  # main only build. The production environment accepts only v* tags. Off
  # until it has the variable SPOTCRAFT_HOOK_URL and the secret
  # SPOTCRAFT_DEPLOY_TOKEN. A job's `if` can't see an environment's variables,
  # so the step checks.
  deploy:
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to Spotcraft
        env:
          URL: ${{ vars.SPOTCRAFT_HOOK_URL }}
          TOKEN: ${{ secrets.SPOTCRAFT_DEPLOY_TOKEN }}
          # A pull may take 5 minutes and the health check 2, after other apps' deploys.
          WAIT_MINUTES: 15
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::notice::No deploy: set SPOTCRAFT_HOOK_URL and SPOTCRAFT_DEPLOY_TOKEN in the production environment."
            exit 0
          fi
          TAG="sha-${GITHUB_SHA::7}"
          auth="Authorization: Bearer $TOKEN"
          curl -fsS --retry 5 --retry-all-errors -X POST "$URL" -H "$auth" \
            -H 'content-type: application/json' -d "{\"tag\":\"$TAG\"}"
          deadline=$((SECONDS + WAIT_MINUTES * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            sleep 5
            # A failed poll (Spotcraft restarting, a network blip) is tried again.
            result=$(curl -fsS "$URL" -H "$auth") || continue
            case $(echo "$result" | jq -r '.state + " " + .tag') in
              "live $TAG") exit 0 ;;
              live*) echo "Another tag is live: $result"; exit 1 ;;
              failed*) echo "$result"; exit 1 ;;
            esac
          done
          echo "Not live after $WAIT_MINUTES minutes"; exit 1
