packages:
  - "packages/*"
allowBuilds:
  esbuild: true
  # Picks Vue 2 or 3 builds; its default is already Vue 3 (vue-query uses it).
  vue-demi: false
# Wait a day before installing a newly published version, so a compromised
# release has time to be caught and pulled.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # The owner's own packages, published from their CI with npm provenance:
  # Spotkit (the app helpers and the CLI) and Spotstrap's blocks.
  - "@kodentuzo/spotkit"
  - "@kodentuzo/spotstrap"
