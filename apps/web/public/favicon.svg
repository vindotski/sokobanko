<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Sokobanko</title>
  <!-- A box on its goal, as the game draws it; inverted in dark mode. -->
  <style>
    .tile { fill: #fff; }
    .box { fill: #000; }
    .check { stroke: #fff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #000; }
      .box { fill: #fff; }
      .check { stroke: #000; }
    }
  </style>
  <rect class="tile" width="64" height="64" />
  <rect class="box" x="4" y="4" width="56" height="56" />
  <path class="check" d="M17 33l10 10l20-22" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
