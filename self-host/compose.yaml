# Sokoban without Spotcraft (docs/Self-Hosting.md): Postgres, the user pool,
# the app and Caddy, on http://localhost:8080. CI runs it and scripts/smoke.ts
# against it. The passwords and secret are fixed, for a throwaway local stack:
# change them, and put TLS in front, before running it anywhere else.
#
#   pnpm self-host        build the image, start the stack, migrate
#   pnpm self-host:smoke  the smoke test
#   pnpm self-host:down   stop it and delete its data
#
# The legal facts are legal-facts.json, served by Caddy at
# /_spotcraft/legal.json, as Spotcraft serves them.
name: sokoban-self-host

x-pool: &pool
  AUTH_ISSUER: http://localhost:8080/pools/main

services:
  # Spotcraft's Postgres image. init.sql makes the roles and schemas on a fresh
  # volume, as Spotcraft's servers and `spotkit dev` have them.
  postgres:
    image: postgres:18.7-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: self-host-superuser
    volumes:
      - data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-q",
          "-h",
          "/var/run/postgresql",
          "-U",
          "postgres",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  # The user pool, from the pinned Spotcraft 0.9.1 image (the last that holds
  # the pool; Spotcraft 0.20 moved it to Spotpass). It migrates the auth schema
  # when it starts.
  auth:
    image: vindotski/spotcraft:0.9.1@sha256:e62ced5b774078679b0063ed16e64ec6c73f39a1f03d767231e9d0087ab3f8d5
    restart: unless-stopped
    working_dir: /app/auth
    command: ["src/index.ts"]
    environment:
      <<: *pool
      PORT: "3000"
      AUTH_DATABASE_URL: postgres://spotcraft_auth:self-host-auth-password@postgres:5432/apps
      AUTH_SECRET: self-host-secret-change-me-0123456789abcdef
      AUTH_PROTOCOL: http
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 60

  # Read-only, as on Spotcraft: only /tmp is written, by the migrations. The
  # health check is the image's, checked more often.
  app:
    image: ${SOKOBAN_IMAGE:-sokoban:self-host}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: *pool
      DATABASE_URL: postgres://app_sokoban:self-host-app-password@postgres:5432/apps
      AUTH_URL: http://auth:3000/_spotcraft/auth
      AUTH_JWKS_URL: http://auth:3000/_spotcraft/auth/jwks
      NUXT_PUBLIC_SITE_URL: http://localhost:8080
      # Where the app reads the legal facts: the Caddy below serves them.
      LEGAL_URL: http://caddy:8080/_spotcraft/legal.json
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 60

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./legal-facts.json:/srv/legal.json:ro
    depends_on:
      app:
        condition: service_healthy
      auth:
        condition: service_healthy

volumes:
  data:
